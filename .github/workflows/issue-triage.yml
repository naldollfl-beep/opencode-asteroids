name: Triage de issues

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    concurrency:
      group: triage-issue-${{ github.event.issue.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Clasificar y formatear issue
        run: node .github/scripts/triage-issue.mjs
        env:
          # Token efímero que GitHub genera automáticamente para cada run:
          # no es un PAT ni un secret que haya que crear, configurar o rotar.
          # Solo alcanza a este repo (con los permisos del bloque permissions
          # de arriba) y caduca al terminar el job.
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
